<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping list example</title>
    <style>
      li {
        margin-bottom: 10px;
      }

      li button {
        font-size: 12px;
        margin-left: 20px;
        color: #666;
      }
    </style>
  </head>
  <body>

    <h1>My shopping list</h1>

    <form>
      <label for="item">Enter a new item:</label>
      <input type="text" name="item" id="item">
      <button>Add item</button>
    </form>

    <ul>

    </ul>

    <script>
      const ulReference = document.querySelector('ul');
      const inputReference = document.querySelector('input');
      const buttonReference = document.querySelector('button');

      const deleteButtonReference = document.querySelector('.delete-btn');

      buttonReference.addEventListener('click', handleButtonClick);

      function handleButtonClick(event) {
        let inputValue = inputReference.value;

        inputReference.value = "";

        const listItem = document.createElement('li');
        const newSpan = document.createElement('span');
        const newButton = document.createElement('button');

        newButton.textContent = "Delete";
        newButton.classList.value = "delete-btn";

        listItem.appendChild(newSpan);
        listItem.appendChild(newButton);

        newSpan.textContent = inputValue;

        ulReference.appendChild(listItem);

        console.log(inputValue);

        newButton.addEventListener('click', () => {
          listItem.remove();
        });

        inputReference.focus();

        event.preventDefault();
      }















    </script>
  </body>
</html>
